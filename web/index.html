<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->

  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="screen-orientation" content="portrait" />
  <meta name="x5-orientation" content="portrait" />
  <meta name="full-screen" content="yes" />
  <meta name="x5-fullscreen" content="true" />
  <meta name="screen-orientation" content="portrait" />

  <meta name="theme-color" content="#150721" />

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pilipili">

  <title>pilipili</title>
  <script>
    // Guard for flutter_inappwebview_web startup on web.
    // Some versions expect this object to exist before assigning nativeCommunication.
    window.flutter_inappwebview = window.flutter_inappwebview || {};
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
      }
    });
  </script>
  <script src="script.js" defer></script>
  <script async>
    var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent); 
    var links = document.createElement('link');
    if(isSafari){
      links.rel = 'manifest';
      links.href = 'manifest.json';
      document.head.append(links);
    }else{
      links.rel = 'manifest';
      links.href = 'manifest.webmanifest';
      document.head.append(links);
    }
  </script>
  <style>
    video {
      pointer-events: none;
    }

    *::-webkit-media-controls {
      display: none !important;
      -webkit-appearance: none;
    }

    *::-webkit-media-controls-panel {
      display: none !important;
      -webkit-appearance: none;
    }

    *::-webkit-media-controls-play-button {
      display: none !important;
      -webkit-appearance: none;
    }

    *::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none;
    }
  </style>
</head>

<body
  style="position: fixed; inset: 0px; overflow: hidden; padding: 0px; margin: 0px; user-select: none; touch-action: none; font: 14px sans-serif; color: red;">
  <!-- This script installs service_worker.js to provide PWA functionality to
       application. For more information, see:
       https://developers.google.com/web/fundamentals/primers/service-workers -->
  <script src="js/hls.js" type="application/javascript"></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      if ('serviceWorker' in navigator) {
        var customServiceWorkerUrl = './sw.js';
        navigator.serviceWorker.register(customServiceWorkerUrl, { scope: '.' }).then(function (registration) {
          // Registration was successful
          console.log('CustomServiceWorker registration successful with scope: ', registration.scope);
        }, function (err) {
          // registration failed
          console.log('CustomServiceWorker registration failed: ', err);
        });
      }
    });
  </script>

</body>

</html>
